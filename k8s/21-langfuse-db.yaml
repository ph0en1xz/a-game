apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-db-config
  namespace: a-game
  labels:
    app.kubernetes.io/name: a-game-create-lang-db
    app.kubernetes.io/part-of: a-game
data:
  create_langfuse_db.sql: |
    \set ON_ERROR_STOP 1

    -- Create the role if it doesn't exist
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'langfuse') THEN
        CREATE ROLE langfuse WITH LOGIN;
      END IF;
    END
    $$;

    --- Pass 'pw' as password variable - to be populate with
    --- the actual pass word by the pod upon initialization
    ALTER ROLE langfuse PASSWORD :'pw';
   
    --- Create langfuse database if not exists
    SELECT 'CREATE DATABASE langfuse WITH OWNER langfuse'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'langfuse')\gexec
---
apiVersion: batch/v1
kind: Job
metadata:
  name: a-game-create-lang-db
  namespace: a-game
  labels:
    app.kubernetes.io/name: a-game-create-lang-db
    app.kubernetes.io/part-of: a-game
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300 # remove it self after 5 minutes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a-game-create-lang-db
        app.kubernetes.io/part-of: a-game
    spec:
      serviceAccountName: a-game-create-lang-db-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
      containers:
        - name: create-lang-db
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - 'psql -f /etc/langfuse_db_config/create_langfuse_db.sql -v pw="$LANG_PG_PASSWORD"'
          env:
            - { name: PGHOST, value: a-game-postgres } # a-game host just to connect to postgres db
            - { name: PGPORT, value: "5432" } # a-game port just to connect to postgres db
            - { name: PGDATABASE, value: "postgres" } # default db - just for connecting to postgres db
            - { name: PGUSER, valueFrom: { 
                secretKeyRef: { 
                  name: db-credentials, key: POSTGRES_USER } } }
            - { name: PGPASSWORD, valueFrom: { 
                secretKeyRef: { 
                  name: db-credentials, key: POSTGRES_PASSWORD } } }
            - { name: LANG_PG_PASSWORD, valueFrom: { 
                secretKeyRef: { 
                  name: lang-db-credentials, key: PGPASSWORD } } }
          volumeMounts: # where to put a volume
            - name: config
              mountPath: /etc/langfuse_db_config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: langfuse-db-config
