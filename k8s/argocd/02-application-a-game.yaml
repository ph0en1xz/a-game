apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: a-game
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ph0en1xz/a-game.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: a-game