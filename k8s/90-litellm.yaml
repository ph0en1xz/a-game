# Litellm - anthropic haiku model config
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-litellm
data:
  config.yaml: |
    model_list:
      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY

      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY

    litellm_settings:
      drop_params: true                  # Drops non-Anthropic OpenAI parameters safely
      set_verbose: false                 # Set to true only for staging/debugging logs
      num_retries: 2
      request_timeout: 50
      fallbacks: [{"claude-haiku": ["gpt-4o-mini"]}]
---
# Litellm service
apiVersion: v1
kind: Service
metadata:
  name: a-game-litellm
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-litellm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: a-game-litellm
  ports:
    - name: http
      protocol: TCP
      port: 4000          # the port the Service listens on
      targetPort: 4000    # the containerPort it forwards to
---
# Litellm deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-game-litellm
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a-game-litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: a-game
        app.kubernetes.io/name: a-game-litellm
    spec:
      serviceAccountName: a-game-litellm-sa
      # Pod-level security settings
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.95.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                { name: "anthropic-credentials" }
            - secretRef:
                { name: "openai-credentials" }
          volumeMounts: # where to put a volume
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          livenessProbe:
              httpGet: { path: /health/liveliness, port: 4000 }
              initialDelaySeconds: 20
              periodSeconds: 15
          readinessProbe:
              httpGet: { path: /health/readiness, port: 4000 }
              initialDelaySeconds: 20
              periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          # No readOnlyRootFilesystem here: it's a third-party image and we
          # don't know what it writes. These two cost nothing either way.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: litellm-config
