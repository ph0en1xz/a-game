    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: a-game-lang-minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: a-game-lang-clickhouse
      ports:
