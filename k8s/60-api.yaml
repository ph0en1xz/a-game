apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-game-api
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a-game-api # what the Deployment looks for. 
                                         # Must match the pod template's labels (#2)
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: a-game
        app.kubernetes.io/name: a-game-api
    spec:
      serviceAccountName: a-game-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the appuser we created in the Dockerfile
      containers:
        - name: api
          image: a-game-api:0.1.0
          imagePullPolicy: IfNotPresent # use the k3d-imported image; don't hit a registry
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false # can't become root (allowPrivilegeEscalation: false)
            readOnlyRootFilesystem: true # and can't persist anything to disk anyway
            capabilities:
              drop: ["ALL"] # and even if it somehow were, has no root powers (drop: ALL)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: a-game-api
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-api
spec:
  selector:
    app.kubernetes.io/name: a-game-api
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: a-game
  name: a-game-api
spec:
  ingressClassName: traefik
  rules:
    - http: # a reference. It points at the Service's named port (#2) 
            # instead of hardcoding number: 80.
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a-game-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a-game-api
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-api
spec:
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
              

          
     
          
      
