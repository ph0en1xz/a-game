apiVersion: v1
kind: Service
metadata:
  name: a-game-redis
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: a-game-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: a-game-redis
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-redis
spec:
  serviceName: a-game-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a-game-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a-game-redis
        app.kubernetes.io/part-of: a-game
    spec:
      securityContext:            # Redis runs fine as non-root
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi