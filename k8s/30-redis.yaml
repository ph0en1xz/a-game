# No `maxmemory` is set, so Redis keeps its default eviction policy: noeviction.
# That is load-bearing, not incidental. Langfuse runs its ingestion queue on this
# instance (BullMQ, ADR 0008 option C), and BullMQ requires noeviction — under any
# evicting policy Redis silently discards queued trace events under pressure.
# So: if a `maxmemory` limit is ever added here, add `--maxmemory-policy noeviction`
# with it, or trace ingestion starts losing data with nothing in the logs.
#
# Two tenants share this instance by logical db index: db 0 is the api/brain
# read-through cache, db 1 is the Langfuse queue.
apiVersion: v1
kind: Service
metadata:
  name: a-game-redis
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: a-game-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: a-game-redis
  namespace: a-game
  labels:
    app.kubernetes.io/part-of: a-game
    app.kubernetes.io/name: a-game-redis
spec:
  serviceName: a-game-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a-game-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a-game-redis
        app.kubernetes.io/part-of: a-game
    spec:
      securityContext:            # Redis runs fine as non-root
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:                    # already runs as uid 999, so it
            allowPrivilegeEscalation: false   # needs no capabilities at all
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi