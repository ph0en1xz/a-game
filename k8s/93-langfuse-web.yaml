apiVersion: v1
kind: Service
metadata:
  name: a-game-lang-web
  namespace: a-game
  labels:
    app.kubernetes.io/name: a-game-lang-web
    app.kubernetes.io/part-of: a-game
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: a-game-lang-web
  ports:
    - name: web
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-game-lang-web
  namespace: a-game
  labels:
    app.kubernetes.io/name: a-game-lang-web
    app.kubernetes.io/part-of: a-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a-game-lang-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a-game-lang-web
        app.kubernetes.io/part-of: a-game
    spec: # pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      serviceAccountName: a-game-lang-web-sa
      containers: # container level
        - name: langfuse-web
          image: langfuse/langfuse:4
          envFrom:
            - secretRef:
                name: clickhouse-credentials
            - secretRef:
                name: langfuse-credentials
            - secretRef:
                name: langfuse-web-secrets
          env:        
            - { name: NEXTAUTH_URL, value: http://localhost:3000 }
            - { name: CLICKHOUSE_URL, value: http://a-game-lang-clickhouse:8123 }
            - { name: CLICKHOUSE_MIGRATION_URL, value: clickhouse://a-game-lang-clickhouse:9000 }
            - { name: CLICKHOUSE_CLUSTER_ENABLED, value: "false" }
            - { name: REDIS_CONNECTION_STRING, value: redis://a-game-redis:6379/1 }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET, value: langfuse }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT, value: http://a-game-lang-minio:9000 }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_REGION, value: auto }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE, value: "true" }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET, value: langfuse }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT, value: http://a-game-lang-minio:9000 }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_REGION, value: auto }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE, value: "true" }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX, value: "events/" }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX, value: "media/" }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID, valueFrom: {
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER } } }
            - { name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY, valueFrom: {
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD } } }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID, valueFrom: {
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER } } }
            - { name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY, valueFrom: {
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD } } }
            - { name: TELEMETRY_ENABLED, value: "false" }
            - { name: DATABASE_HOST, value: a-game-postgres }
            - { name: DATABASE_NAME, value: langfuse }
            - { name: DATABASE_USERNAME, value: langfuse }
            - { name: DATABASE_PASSWORD, valueFrom: {
                secretKeyRef: {
                  name: lang-db-credentials, key: PGPASSWORD } } }
          startupProbe:
            httpGet: { path: /api/public/health, port: 3000 }
            timeoutSeconds: 10
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/public/health, port: 3000 }
            timeoutSeconds: 10
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/public/ready, port: 3000 }
            timeoutSeconds: 10
            failureThreshold: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"] 
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }