apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: a-game
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: web
      port: 80 
      targetPort: 80
---
#Network Policies are equivalent to security groups in AWS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: a-game
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: a-game
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi  }
            limits: { cpu: 250m, memory: 128Mi }
