name: CI - k8s manifests

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/ci-k8s-manifests.yml'
  pull_request:
    paths:
      - 'k8s/**'
      - '.github/workflows/ci-k8s-manifests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cross-reference names
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_k8s_refs.py k8s

      # The other half of the same blind spot. A connection needs the source's
      # egress AND the destination's ingress; get one side wrong and both files
      # still apply cleanly, then time out at run time.
      - name: Pair network policies
        run: python3 scripts/check_k8s_policies.py k8s

      # A throwaway API server is what makes this worth running. Offline schema
      # linters catch unknown fields, but `policyTypes: [Igress]` is a plain
      # string in the OpenAPI schema — only the real API server rejects it.
      - name: Create throwaway cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: manifest-validation

      # ArgoCD
      - name: Install Argo CD CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/crds/application-crd.yaml
    
      - name: Create argo CD namespace
        run: kubectl apply -f k8s/argocd/01-argocd-namespace.yaml

      - name: Validate manifests for argoCD
        run: kubectl apply --dry-run=server -f k8s/argocd/

      # Application
      - name: Create namespace
        run: kubectl apply -f k8s/00-namespace.yaml

      - name: Validate manifests
        run: kubectl apply --dry-run=server -f k8s/
