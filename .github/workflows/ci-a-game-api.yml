name: CI - a-game-api

on:
  push:
    branches: [main]
    paths:
      - 'a-game-api/**'
      - '.github/workflows/ci-a-game-api.yml'
  pull_request:
    paths:
      - 'a-game-api/**'
      - '.github/workflows/ci-a-game-api.yml'

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a-game-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.11.28'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --with ruff ruff check .

      - name: Type check
        run: uv run --with mypy mypy app

      - name: Tests
        run: uv run pytest -q

      - name: Build Docker image
        run: docker build -t a-game-api:test .
