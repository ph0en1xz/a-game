<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A-Game Flow 2 — API request (plain read, no computation)</title>
<desc>Sequence diagram. An API consumer sends a GET request with a Bearer API key. The FastAPI service validates the key and rate limit, checks the Redis cache, and on a hit returns cached JSON. On a miss it selects the latest precomputed predictions from PostgreSQL, stores them in the cache with a TTL, and returns them. There are no pending states and no computation on request.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.ret { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
.life { stroke: #C9C7BF; stroke-width: 1; stroke-dasharray: 4 4; }
.frame { fill: none; stroke: #B4B2A9; stroke-width: 0.75; stroke-dasharray: 5 4; }
.title { font-size: 13px; font-weight: 500; }
.sub { font-size: 11px; }
.lbl { font-size: 11px; fill: #444441; text-anchor: middle; }
.num { font-size: 10px; fill: #FFFFFF; text-anchor: middle; font-weight: 600; }
</style>
</defs>

<text x="24" y="28" font-size="15" font-weight="600" fill="#2C2C2A">Flow 2 — API request (plain read, no computation)</text>
<text x="24" y="46" font-size="11" fill="#5F5E5A">ADR 0005 · api-spec v2 — every request is an immediate read of predictions precomputed by Flow 1</text>

<line class="life" x1="100" y1="110" x2="100" y2="650"/>
<line class="life" x1="340" y1="110" x2="340" y2="650"/>
<line class="life" x1="580" y1="110" x2="580" y2="650"/>
<line class="life" x1="820" y1="110" x2="820" y2="650"/>

<rect x="25" y="60" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="title" fill="#2C2C2A" x="100" y="78" text-anchor="middle" dominant-baseline="central">API consumer</text>
<text class="sub" fill="#444441" x="100" y="96" text-anchor="middle" dominant-baseline="central">curl · Postman · service</text>

<rect x="265" y="60" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="title" fill="#3C3489" x="340" y="78" text-anchor="middle" dominant-baseline="central">API service</text>
<text class="sub" fill="#534AB7" x="340" y="96" text-anchor="middle" dominant-baseline="central">FastAPI</text>

<rect x="505" y="60" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="title" fill="#085041" x="580" y="78" text-anchor="middle" dominant-baseline="central">Redis</text>
<text class="sub" fill="#0F6E56" x="580" y="96" text-anchor="middle" dominant-baseline="central">cache</text>

<rect x="745" y="60" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="title" fill="#085041" x="820" y="78" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="sub" fill="#0F6E56" x="820" y="96" text-anchor="middle" dominant-baseline="central">predictions</text>

<line class="arr" x1="100" y1="142" x2="334" y2="142" marker-end="url(#arrow)"/>
<circle cx="118" cy="142" r="10" fill="#534AB7"/><text class="num" x="118" y="146">1</text>
<text class="lbl" x="220" y="118">GET /v1/leagues/{league}/suggestions</text>
<text class="lbl" x="220" y="132">Authorization: Bearer &lt;api-key&gt;</text>

<rect x="245" y="172" width="190" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<circle cx="245" cy="194" r="10" fill="#534AB7"/><text class="num" x="245" y="198">2</text>
<text class="sub" fill="#3C3489" x="343" y="188" text-anchor="middle" dominant-baseline="central">validate key · rate limit</text>
<text class="sub" fill="#534AB7" x="343" y="204" text-anchor="middle" dominant-baseline="central" font-size="10">401 invalid · 429 over limit</text>

<line class="arr" x1="340" y1="252" x2="574" y2="252" marker-end="url(#arrow)"/>
<circle cx="358" cy="252" r="10" fill="#534AB7"/><text class="num" x="358" y="256">3</text>
<text class="lbl" x="460" y="244">cache lookup</text>

<line class="ret" x1="580" y1="296" x2="346" y2="296" marker-end="url(#arrow)"/>
<text class="lbl" x="460" y="288">hit / miss</text>

<rect class="frame" x="60" y="326" width="790" height="76" rx="8"/>
<text x="72" y="344" font-size="11" font-weight="600" fill="#854F0B">cache hit</text>
<line class="ret" x1="340" y1="376" x2="106" y2="376" marker-end="url(#arrow)"/>
<circle cx="322" cy="376" r="11" fill="#534AB7"/><text class="num" x="322" y="380">4a</text>
<text class="lbl" x="220" y="368">200 OK — cached JSON</text>

<rect class="frame" x="60" y="422" width="790" height="214" rx="8"/>
<text x="72" y="440" font-size="11" font-weight="600" fill="#854F0B">cache miss</text>

<line class="arr" x1="340" y1="470" x2="814" y2="470" marker-end="url(#arrow)"/>
<circle cx="358" cy="470" r="11" fill="#534AB7"/><text class="num" x="358" y="474">4b</text>
<text class="lbl" x="580" y="462">SELECT latest predictions (per fixture, latest model version)</text>

<line class="ret" x1="820" y1="514" x2="346" y2="514" marker-end="url(#arrow)"/>
<text class="lbl" x="580" y="506">rows</text>

<line class="arr" x1="340" y1="556" x2="574" y2="556" marker-end="url(#arrow)"/>
<circle cx="358" cy="556" r="10" fill="#534AB7"/><text class="num" x="358" y="560">5</text>
<text class="lbl" x="460" y="548">store in cache (TTL)</text>

<line class="ret" x1="340" y1="600" x2="106" y2="600" marker-end="url(#arrow)"/>
<circle cx="322" cy="600" r="10" fill="#534AB7"/><text class="num" x="322" y="604">6</text>
<text class="lbl" x="220" y="592">200 OK — JSON · generated_at = last pipeline run</text>

<text x="24" y="690" font-size="11" font-style="italic" fill="#5F5E5A">No REQUEST_PENDING, no polling, no on-demand Claude calls — predictions already exist (Flow 1). Concurrent callers (e.g. Chelsea + Premier League) read the same immutable rows.</text>
</svg>
