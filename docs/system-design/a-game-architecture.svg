<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960" viewBox="0 0 680 960" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A-Game layered architecture (v1 — ADR 0005)</title>
<desc>Seven layers: client (Phase 2), edge, messaging, processing, shared, data, external. Precompute pipeline: the ingestion worker (CronJob daily at 06:00 UTC) fetches the sports data API, upserts facts to PostgreSQL, and publishes a data-ready job to RabbitMQ only if the upsert changed rows; the calculation service consumes it, computes predictions, calls the Claude API for narration, writes predictions to PostgreSQL and warms the Redis cache. The API service serves plain reads through the shared Redis and Postgres packages. Dashed lines are package dependencies, solid lines are runtime data flow. The Next.js browser client is Phase 2.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.band { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 4; }
.bandlabel { font-size: 12px; fill: #5F5E5A; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.dep { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
.title { font-size: 14px; font-weight: 500; }
.sub { font-size: 12px; }
</style>
</defs>

