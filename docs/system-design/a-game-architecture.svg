<text class="title" fill="#2C2C2A" x="390" y="92" text-anchor="middle" dominant-baseline="central">Next.js app</text>
<text class="sub" fill="#444441" x="390" y="110" text-anchor="middle" dominant-baseline="central">Browser client — Phase 2</text>
</g>

