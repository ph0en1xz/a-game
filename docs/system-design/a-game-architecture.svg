<rect x="170" y="852" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="title" fill="#712B13" x="265" y="872" text-anchor="middle" dominant-baseline="central">Claude API</text>
<text class="sub" fill="#993C1D" x="265" y="890" text-anchor="middle" dominant-baseline="central">Narrative generation</text>
<rect x="400" y="852" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="title" fill="#712B13" x="495" y="872" text-anchor="middle" dominant-baseline="central">Sports data API</text>
<text class="sub" fill="#993C1D" x="495" y="890" text-anchor="middle" dominant-baseline="central">Fixtures and stats</text>

