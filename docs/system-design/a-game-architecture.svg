<rect x="170" y="462" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="title" fill="#3C3489" x="265" y="482" text-anchor="middle" dominant-baseline="central">Calculation service</text>
<text class="sub" fill="#534AB7" x="265" y="500" text-anchor="middle" dominant-baseline="central">Precomputes and narrates</text>
<rect x="400" y="462" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
