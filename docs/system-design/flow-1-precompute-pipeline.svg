<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A-Game Flow 1 — Precompute pipeline (runs daily at 06:00 UTC)</title>
<desc>Sequence diagram. A Kubernetes CronJob fires the worker once daily at 06:00 UTC. The worker fetches football-data.org, upserts raw facts into PostgreSQL, and publishes a data-ready job to RabbitMQ only if the upsert changed rows — an unchanged run publishes nothing and exits zero. The brain consumes the job, reads facts and history from PostgreSQL, computes Elo and Poisson predictions for all upcoming fixtures, calls the Claude API for narrated previews, writes permanent model-versioned predictions to PostgreSQL, and warms the Redis cache. Client requests never appear in this flow.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.ret { stroke: #5F5E5A; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
.life { stroke: #C9C7BF; stroke-width: 1; stroke-dasharray: 4 4; }
.title { font-size: 13px; font-weight: 500; }
.sub { font-size: 11px; }
.lbl { font-size: 11px; fill: #444441; text-anchor: middle; }
.num { font-size: 10px; fill: #FFFFFF; text-anchor: middle; font-weight: 600; }
</style>
</defs>

<text x="24" y="28" font-size="15" font-weight="600" fill="#2C2C2A">Flow 1 — Precompute pipeline (runs daily at 06:00 UTC)</text>
<text x="24" y="46" font-size="11" fill="#5F5E5A">ADR 0005 + ADR 0007 · worker refreshes facts daily → publishes only if rows changed → brain recomputes ALL upcoming fixtures → Postgres (permanent) + Redis (cache)</text>

<line class="life" x1="80" y1="110" x2="80" y2="730"/>
<line class="life" x1="225" y1="110" x2="225" y2="730"/>
<line class="life" x1="370" y1="110" x2="370" y2="730"/>
<line class="life" x1="515" y1="110" x2="515" y2="730"/>
<line class="life" x1="660" y1="110" x2="660" y2="730"/>
<line class="life" x1="805" y1="110" x2="805" y2="730"/>
<line class="life" x1="950" y1="110" x2="950" y2="730"/>
<line class="life" x1="1095" y1="110" x2="1095" y2="730"/>

<rect x="14" y="60" width="132" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="title" fill="#2C2C2A" x="80" y="78" text-anchor="middle" dominant-baseline="central">Scheduler</text>
<text class="sub" fill="#444441" x="80" y="96" text-anchor="middle" dominant-baseline="central">k8s CronJob · daily</text>

<rect x="159" y="60" width="132" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="title" fill="#3C3489" x="225" y="78" text-anchor="middle" dominant-baseline="central">worker</text>
<text class="sub" fill="#534AB7" x="225" y="96" text-anchor="middle" dominant-baseline="central">Python service</text>

<rect x="304" y="60" width="132" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="title" fill="#712B13" x="370" y="78" text-anchor="middle" dominant-baseline="central">football-data.org</text>
<text class="sub" fill="#993C1D" x="370" y="96" text-anchor="middle" dominant-baseline="central">external API</text>

<rect x="449" y="60" width="132" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="title" fill="#085041" x="515" y="78" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="sub" fill="#0F6E56" x="515" y="96" text-anchor="middle" dominant-baseline="central">facts + predictions</text>

<rect x="594" y="60" width="132" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="title" fill="#2C2C2A" x="660" y="78" text-anchor="middle" dominant-baseline="central">RabbitMQ</text>
<text class="sub" fill="#444441" x="660" y="96" text-anchor="middle" dominant-baseline="central">single broker</text>

<rect x="739" y="60" width="132" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="title" fill="#3C3489" x="805" y="78" text-anchor="middle" dominant-baseline="central">brain</text>
<text class="sub" fill="#534AB7" x="805" y="96" text-anchor="middle" dominant-baseline="central">Elo · Poisson · AI</text>

<rect x="884" y="60" width="132" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="title" fill="#712B13" x="950" y="78" text-anchor="middle" dominant-baseline="central">Claude API</text>
<text class="sub" fill="#993C1D" x="950" y="96" text-anchor="middle" dominant-baseline="central">Haiku</text>

<rect x="1029" y="60" width="132" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="title" fill="#085041" x="1095" y="78" text-anchor="middle" dominant-baseline="central">Redis</text>
<text class="sub" fill="#0F6E56" x="1095" y="96" text-anchor="middle" dominant-baseline="central">read-through cache</text>

<line class="arr" x1="80" y1="140" x2="219" y2="140" marker-end="url(#arrow)"/>
<circle cx="98" cy="140" r="10" fill="#534AB7"/><text class="num" x="98" y="144">1</text>
<text class="lbl" x="152" y="132">fires</text>

<line class="arr" x1="225" y1="192" x2="364" y2="192" marker-end="url(#arrow)"/>
<circle cx="243" cy="192" r="10" fill="#534AB7"/><text class="num" x="243" y="196">2</text>
<text class="lbl" x="297" y="168">GET matches · standings · scorers</text>
<text class="lbl" x="297" y="182">(rate-limited, incremental)</text>

<line class="ret" x1="370" y1="240" x2="231" y2="240" marker-end="url(#arrow)"/>
<text class="lbl" x="297" y="232">raw JSON</text>

<line class="arr" x1="225" y1="288" x2="509" y2="288" marker-end="url(#arrow)"/>
<circle cx="243" cy="288" r="10" fill="#534AB7"/><text class="num" x="243" y="292">3</text>
<text class="lbl" x="370" y="280">UPSERT raw facts (idempotent)</text>

<line class="arr" x1="225" y1="336" x2="654" y2="336" marker-end="url(#arrow)"/>
<circle cx="243" cy="336" r="10" fill="#534AB7"/><text class="num" x="243" y="340">4</text>
<text class="lbl" x="442" y="322">publish "data ready" job</text>
<text class="lbl" x="442" y="335" font-size="10" fill="#5F5E5A">ONLY if the upsert changed rows (ADR 0007)</text>

<line class="arr" x1="660" y1="384" x2="799" y2="384" marker-end="url(#arrow)"/>
<circle cx="678" cy="384" r="10" fill="#534AB7"/><text class="num" x="678" y="388">5</text>
<text class="lbl" x="732" y="376">deliver job</text>

<line class="arr" x1="805" y1="432" x2="521" y2="432" marker-end="url(#arrow)"/>
<circle cx="787" cy="432" r="10" fill="#534AB7"/><text class="num" x="787" y="436">6</text>
<text class="lbl" x="660" y="424">read facts + history</text>

<rect x="710" y="468" width="190" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<circle cx="710" cy="492" r="10" fill="#534AB7"/><text class="num" x="710" y="496">7</text>
<text class="sub" fill="#3C3489" x="808" y="485" text-anchor="middle" dominant-baseline="central">compute Elo + Poisson</text>
<text class="sub" fill="#3C3489" x="808" y="502" text-anchor="middle" dominant-baseline="central">for ALL upcoming fixtures</text>

<line class="arr" x1="805" y1="560" x2="944" y2="560" marker-end="url(#arrow)"/>
<circle cx="823" cy="560" r="10" fill="#534AB7"/><text class="num" x="823" y="564">8</text>
<text class="lbl" x="877" y="552">narrate preview per fixture</text>

<line class="ret" x1="950" y1="606" x2="811" y2="606" marker-end="url(#arrow)"/>
<text class="lbl" x="877" y="598">preview text</text>

<line class="arr" x1="805" y1="654" x2="521" y2="654" marker-end="url(#arrow)"/>
<circle cx="787" cy="654" r="10" fill="#534AB7"/><text class="num" x="787" y="658">9</text>
<text class="lbl" x="660" y="646">write predictions — permanent, model-versioned</text>

<line class="arr" x1="805" y1="702" x2="1089" y2="702" marker-end="url(#arrow)"/>
<circle cx="823" cy="702" r="10" fill="#534AB7"/><text class="num" x="823" y="706">10</text>
<text class="lbl" x="947" y="694">warm cache (TTL)</text>

<text x="24" y="762" font-size="11" font-style="italic" fill="#5F5E5A">Client requests never appear here — the API only reads what steps 9–10 stored. Claude spend is bounded: one narration per fixture per run (~10–20 calls per league).</text>
</svg>
