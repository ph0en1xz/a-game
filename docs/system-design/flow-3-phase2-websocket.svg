<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A-Game Flow 3 — Phase 2 WebSocket push (planned, not built in v1)</title>
<desc>Sequence diagram, marked as Phase 2 and not built in v1. After each pipeline run the calculation service publishes a predictions-updated event to RabbitMQ. The API service consumes the fan-out event and pushes updated fixtures over WebSocket to the Next.js browser client. This replaces the draft design's Redis pub/sub: RabbitMQ is the single broker for jobs and events.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.life { stroke: #C9C7BF; stroke-width: 1; stroke-dasharray: 4 4; }
.title { font-size: 13px; font-weight: 500; }
.sub { font-size: 11px; }
.lbl { font-size: 11px; fill: #444441; text-anchor: middle; }
.num { font-size: 10px; fill: #FFFFFF; text-anchor: middle; font-weight: 600; }
</style>
</defs>

<rect x="20" y="14" width="840" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="440" y="30" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">PHASE 2 — planned, not built in v1 · WebSockets deferred (ADR 0005)</text>

<g opacity="0.8">
<line class="life" x1="120" y1="120" x2="120" y2="330"/>
<line class="life" x1="340" y1="120" x2="340" y2="330"/>
<line class="life" x1="560" y1="120" x2="560" y2="330"/>
<line class="life" x1="780" y1="120" x2="780" y2="330"/>

<rect x="45" y="70" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="title" fill="#3C3489" x="120" y="88" text-anchor="middle" dominant-baseline="central">Calc service</text>
<text class="sub" fill="#534AB7" x="120" y="106" text-anchor="middle" dominant-baseline="central">end of pipeline run</text>

<rect x="265" y="70" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="title" fill="#2C2C2A" x="340" y="88" text-anchor="middle" dominant-baseline="central">RabbitMQ</text>
<text class="sub" fill="#444441" x="340" y="106" text-anchor="middle" dominant-baseline="central">single broker</text>

<rect x="485" y="70" width="150" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="title" fill="#3C3489" x="560" y="88" text-anchor="middle" dominant-baseline="central">API service</text>
<text class="sub" fill="#534AB7" x="560" y="106" text-anchor="middle" dominant-baseline="central">FastAPI WebSocket</text>

<rect x="705" y="70" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="title" fill="#2C2C2A" x="780" y="88" text-anchor="middle" dominant-baseline="central">Next.js app</text>
<text class="sub" fill="#444441" x="780" y="106" text-anchor="middle" dominant-baseline="central">browser</text>

<line class="arr" x1="120" y1="180" x2="334" y2="180" marker-end="url(#arrow)"/>
<circle cx="138" cy="180" r="10" fill="#534AB7"/><text class="num" x="138" y="184">1</text>
<text class="lbl" x="230" y="156">publish predictions.updated</text>
<text class="lbl" x="230" y="170">(after each pipeline run — Flow 1)</text>

<line class="arr" x1="340" y1="245" x2="554" y2="245" marker-end="url(#arrow)"/>
<circle cx="358" cy="245" r="10" fill="#534AB7"/><text class="num" x="358" y="249">2</text>
<text class="lbl" x="450" y="237">fan-out event</text>

<line class="arr" x1="560" y1="305" x2="774" y2="305" marker-end="url(#arrow)"/>
<circle cx="578" cy="305" r="10" fill="#534AB7"/><text class="num" x="578" y="309">3</text>
<text class="lbl" x="670" y="297">WS push — updated fixtures</text>
</g>

<text x="24" y="370" font-size="11" font-style="italic" fill="#5F5E5A">Replaces the draft's Redis pub/sub: RabbitMQ carries jobs AND events, Redis stays cache-only. Until Phase 2, clients simply re-request (Flow 2).</text>
</svg>
