<!-- entry chain -->
<line class="arr" x1="172" y1="150" x2="182" y2="238" marker-end="url(#arrow)"/>
<text class="elbl" x="196" y="196">HTTPS + API key</text>
<line class="arr" x1="182" y1="304" x2="182" y2="334" marker-end="url(#arrow)"/>
<line class="arr" x1="182" y1="392" x2="182" y2="426" marker-end="url(#arrow)"/>

