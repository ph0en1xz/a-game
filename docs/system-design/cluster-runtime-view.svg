<line class="arr" x1="182" y1="652" x2="182" y2="682" marker-end="url(#arrow)"/>
<line class="arr" x1="492" y1="652" x2="492" y2="682" marker-end="url(#arrow)"/>
<line class="arr" x1="802" y1="652" x2="802" y2="682" marker-end="url(#arrow)"/>

