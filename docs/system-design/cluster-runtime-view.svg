<!-- pipeline labels -->
<text class="elbl" x="812" y="576" text-anchor="middle">publish job</text>
<text class="elbl" x="700" y="620" text-anchor="middle" fill="#6A5FD6">consume</text>

<!-- ============ LEGEND ============ -->
<rect x="40" y="892" width="18" height="14" rx="3" fill="#EEEDFE" stroke="#6A5FD6" stroke-width="0.6"/>
<text class="s" fill="#444441" x="64" y="903">Workloads (Deployments · CronJob)</text>
<rect x="290" y="892" width="18" height="14" rx="3" fill="#F1EFE8" stroke="#7C7A72" stroke-width="0.6"/>
<text class="s" fill="#444441" x="314" y="903">Edge &amp; Services (Ingress · ClusterIP · headless)</text>
<rect x="610" y="892" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#2E8B72" stroke-width="0.6"/>
<text class="s" fill="#444441" x="634" y="903">Data stores (StatefulSets + PVC)</text>
<rect x="850" y="892" width="18" height="14" rx="3" fill="#EAF1F6" stroke="#5B7E9C" stroke-width="0.6"/>
<text class="s" fill="#444441" x="874" y="903">Config &amp; identity</text>
<rect x="1010" y="892" width="18" height="14" rx="3" fill="#FAECE7" stroke="#C06A45" stroke-width="0.6"/>
<text class="s" fill="#444441" x="1034" y="903">External (clients · egress)</text>
<line class="egr" x1="40" y1="928" x2="70" y2="928" marker-end="url(#arrow)"/>
<text class="s" fill="#444441" x="78" y="932">orange arrow = allowed egress to the internet</text>
<line class="arr" x1="360" y1="928" x2="390" y2="928" marker-end="url(#arrow)"/>
<text class="s" fill="#444441" x="398" y="932">grey arrow = allowed in-cluster edge (all else denied)</text>
</svg>
