<text class="h" fill="#085041" x="76" y="706">PostgreSQL — StatefulSet</text>
<text class="s" fill="#0F6E56" x="76" y="726">system of record</text>
<text class="s" fill="#0F6E56" x="76" y="744">facts (JSONB) + predictions (model-versioned)</text>
<rect x="76" y="756" width="150" height="20" rx="5" fill="#CDEBE0" stroke="#2E8B72" stroke-width="0.5"/>
<text class="t" fill="#085041" x="151" y="770" text-anchor="middle">PVC · volumeClaimTemplate</text>
<text class="t" fill="#0F6E56" x="76" y="795">prod host TBD (RDS vs external)</text>

<rect x="374" y="684" width="236" height="128" rx="8" fill="#E1F5EE" stroke="#2E8B72" stroke-width="0.7"/>
<text class="h" fill="#085041" x="386" y="706">Redis — StatefulSet</text>
<text class="s" fill="#0F6E56" x="386" y="726">read-through cache only</text>
<text class="s" fill="#0F6E56" x="386" y="744">not removable once Langfuse lands (ADR 0008)</text>
<rect x="386" y="756" width="150" height="20" rx="5" fill="#CDEBE0" stroke="#2E8B72" stroke-width="0.5"/>
<text class="t" fill="#085041" x="461" y="770" text-anchor="middle">PVC · volumeClaimTemplate</text>
<text class="t" fill="#0F6E56" x="386" y="795">warmed by the pipeline, not authoritative</text>

<rect x="684" y="684" width="236" height="128" rx="8" fill="#E1F5EE" stroke="#2E8B72" stroke-width="0.7"/>
<text class="h" fill="#085041" x="696" y="706">RabbitMQ — StatefulSet</text>
<text class="s" fill="#0F6E56" x="696" y="726">single broker · jobs + events</text>
<text class="s" fill="#0F6E56" x="696" y="744">learning target (ADR 0005)</text>
<rect x="696" y="756" width="150" height="20" rx="5" fill="#CDEBE0" stroke="#2E8B72" stroke-width="0.5"/>
<text class="t" fill="#085041" x="771" y="770" text-anchor="middle">PVC · volumeClaimTemplate</text>
<text class="t" fill="#0F6E56" x="696" y="795">disable default guest/guest creds</text>

<!-- ============ CLUSTER-WIDE POSTURE NOTE ============ -->
<rect x="56" y="824" width="868" height="42" rx="8" fill="#FBFAF6" stroke="#C9C7BF" stroke-width="0.7"/>
