<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="946" viewBox="0 0 1280 946" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A-Game — Kubernetes cluster runtime view (v1)</title>
<desc>Every in-cluster object for A-Game and the allowed traffic between them, inside the a-game namespace. The request path runs consumer to Ingress controller to the api ClusterIP Service to the api Deployment. The api, brain and worker workloads reach three data stores (PostgreSQL, Redis, RabbitMQ) through headless Services; each store is a StatefulSet with a PVC. brain calls the Claude API and worker calls football-data.org as egress. A side panel holds the Secrets and per-workload ServiceAccounts, with a prod-only note covering External Secrets, IRSA and the cluster OIDC provider. As verified on 2026-07-30 the only Secrets that exist are db-credentials, rabbitmq-credentials and sports-api-credentials; the app-config ConfigMap is planned but not built, Redis has no auth secret, and the api Deployment consumes no secrets at all. NetworkPolicy is default-deny in both directions as of 2026-07-30 and every arrow is one explicitly allowed edge. Runs on k3s locally; EKS remains the prod target per ADR 0002, with its Terraform kept plan-only per ADR 0009. Matches ADR 0005.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.arr  { stroke: #6E6D68; stroke-width: 1.5; fill: none; }
.egr  { stroke: #C0552F; stroke-width: 1.5; fill: none; }
.h    { font-size: 13px; font-weight: 600; }
.s    { font-size: 10.5px; }
.t    { font-size: 9.5px; }
.note { font-size: 10.5px; fill: #5F5E5A; }
.elbl { font-size: 9.5px; fill: #6E6D68; }
</style>
</defs>

<text x="32" y="40" font-size="18" font-weight="700" fill="#2C2C2A">A-Game — Kubernetes cluster runtime (v1)</text>
<text x="32" y="62" font-size="12" fill="#5F5E5A">Every in-cluster object and the allowed traffic between them. k3s locally · EKS as prod target (ADR 0002) · workloads per ADR 0005.</text>

<!-- ============ EXTERNAL ROW ============ -->
<rect x="60" y="90" width="220" height="58" rx="9" fill="#FAECE7" stroke="#C06A45" stroke-width="0.75"/>
<text class="h" fill="#712B13" x="170" y="112" text-anchor="middle">API consumer</text>
<text class="s" fill="#993C1D" x="170" y="130" text-anchor="middle">curl · Postman · your service</text>

<rect x="800" y="90" width="180" height="58" rx="9" fill="#FAECE7" stroke="#C06A45" stroke-width="0.75"/>
<text class="h" fill="#712B13" x="890" y="112" text-anchor="middle">Claude API</text>
<text class="s" fill="#993C1D" x="890" y="130" text-anchor="middle">egress 443</text>

<rect x="1000" y="90" width="220" height="58" rx="9" fill="#FAECE7" stroke="#C06A45" stroke-width="0.75"/>
<text class="h" fill="#712B13" x="1110" y="112" text-anchor="middle">football-data.org</text>
<text class="s" fill="#993C1D" x="1110" y="130" text-anchor="middle">egress 443</text>

<!-- ============ NAMESPACE / CLUSTER BOUNDARY ============ -->
<rect x="40" y="176" width="900" height="700" rx="16" fill="none" stroke="#8A6FD1" stroke-width="0.9" stroke-dasharray="7 5"/>
<text x="58" y="202" font-size="12" font-weight="600" fill="#4B3FA0">Kubernetes cluster — k3s (local) / EKS (prod target)</text>
<text x="58" y="220" font-size="11" fill="#6A5FD6">namespace: a-game</text>

<!-- ============ CONFIG & IDENTITY PLANE ============ -->
<rect x="965" y="176" width="290" height="548" rx="14" fill="#F5F8FB" stroke="#5B7E9C" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="980" y="202" font-size="12" font-weight="600" fill="#274257">Config, identity &amp; secrets</text>

<rect x="980" y="222" width="260" height="70" rx="8" fill="#EAF1F6" stroke="#5B7E9C" stroke-width="0.6"/>
<text class="h" fill="#274257" x="992" y="242">ConfigMap: app-config — PLANNED, not built</text>
<text class="t" fill="#3E6180" x="992" y="259">league IDs · schedule · model version · base URLs</text>
<text class="t" fill="#3E6180" x="992" y="275">no ConfigMap exists yet; config is inline env</text>

<rect x="980" y="304" width="260" height="128" rx="8" fill="#EAF1F6" stroke="#5B7E9C" stroke-width="0.6"/>
<text class="h" fill="#274257" x="992" y="324">Secrets (Kubernetes) — actual, verified 2026-07-30</text>
<text class="t" fill="#3E6180" x="992" y="343">db-credentials  (postgres · brain · worker)</text>
<text class="t" fill="#3E6180" x="992" y="360">rabbitmq-credentials  (rabbitmq · brain · worker)</text>
<text class="t" fill="#3E6180" x="992" y="377">sports-api-credentials  (worker)</text>
<text class="t" fill="#3E6180" x="992" y="394">Redis has no auth secret — none configured</text>
<text class="t" fill="#3E6180" x="992" y="411">api consumes NO secrets (no envFrom at all)</text>

<rect x="980" y="444" width="260" height="72" rx="8" fill="#EAF1F6" stroke="#5B7E9C" stroke-width="0.6"/>
<text class="h" fill="#274257" x="992" y="464">ServiceAccounts</text>
<text class="t" fill="#3E6180" x="992" y="482">a-game-api-sa · a-game-brain-sa · a-game-worker-sa</text>
<text class="t" fill="#3E6180" x="992" y="499">one identity per workload → least privilege</text>

<rect x="980" y="528" width="260" height="180" rx="8" fill="#EFEDE7" stroke="#9A9890" stroke-width="0.6" stroke-dasharray="4 3"/>
<text class="h" fill="#6B5416" x="992" y="548">EKS only — design-only for now</text>
<text class="t" fill="#5F5E5A" x="992" y="567">External Secrets Operator syncs the</text>
<text class="t" fill="#5F5E5A" x="992" y="582">Secrets above from AWS Secrets Manager.</text>
<text class="t" fill="#5F5E5A" x="992" y="602">IRSA: each ServiceAccount ↔ a scoped</text>
<text class="t" fill="#5F5E5A" x="992" y="617">IAM role, trusted via the cluster</text>
<text class="t" fill="#5F5E5A" x="992" y="632">OIDC provider (the cluster↔AWS bridge).</text>
<text class="t" fill="#5F5E5A" x="992" y="652">Locally: plain Secrets from gitignored .env,</text>
<text class="t" fill="#5F5E5A" x="992" y="667">no OIDC, no Secrets Manager.</text>

<!-- ============ EDGE: INGRESS CONTROLLER ============ -->
<rect x="64" y="240" width="236" height="64" rx="8" fill="#F1EFE8" stroke="#7C7A72" stroke-width="0.6"/>
<text class="h" fill="#2C2C2A" x="182" y="261" text-anchor="middle">Ingress controller</text>
<text class="s" fill="#5F5E5A" x="182" y="278" text-anchor="middle">Traefik (k3s) · AWS LB Controller (EKS)</text>
<text class="t" fill="#5F5E5A" x="182" y="294" text-anchor="middle">Ingress rule: TLS termination · /v1 → api</text>

<!-- api Service -->
<rect x="64" y="336" width="236" height="56" rx="8" fill="#F1EFE8" stroke="#7C7A72" stroke-width="0.6"/>
<text class="h" fill="#2C2C2A" x="182" y="357" text-anchor="middle">api Service — ClusterIP</text>
<text class="s" fill="#5F5E5A" x="182" y="375" text-anchor="middle">stable in-cluster address :8000</text>

<!-- ============ WORKLOADS ROW ============ -->
<rect x="64" y="428" width="236" height="120" rx="8" fill="#EEEDFE" stroke="#6A5FD6" stroke-width="0.7"/>
<text class="h" fill="#3C3489" x="76" y="450">api — Deployment</text>
<text class="s" fill="#534AB7" x="76" y="470">FastAPI · plain reads, no compute</text>
<text class="s" fill="#534AB7" x="76" y="488">SA: a-game-api-sa</text>
<text class="s" fill="#534AB7" x="76" y="506">cfg: none (image defaults)</text>
<text class="s" fill="#534AB7" x="76" y="524">secrets: none — no envFrom</text>
<text class="t" fill="#8A83C8" x="76" y="541">reached by Ingress → serves consumers</text>

<rect x="374" y="428" width="236" height="120" rx="8" fill="#EEEDFE" stroke="#6A5FD6" stroke-width="0.7"/>
<text class="h" fill="#3C3489" x="386" y="450">brain — Deployment</text>
<text class="s" fill="#534AB7" x="386" y="470">RabbitMQ consumer · Elo/Poisson + Haiku</text>
<text class="s" fill="#534AB7" x="386" y="488">SA: a-game-brain-sa</text>
<text class="s" fill="#534AB7" x="386" y="506">cfg: inline env (no ConfigMap)</text>
<text class="s" fill="#534AB7" x="386" y="524">secrets: db · rabbitmq  (no Claude key yet)</text>
<text class="t" fill="#8A83C8" x="386" y="541">no Service — nothing calls it, it pulls</text>

<rect x="684" y="428" width="236" height="120" rx="8" fill="#EEEDFE" stroke="#6A5FD6" stroke-width="0.7"/>
<text class="h" fill="#3C3489" x="696" y="450">worker — CronJob</text>
<text class="s" fill="#534AB7" x="696" y="470">schedule 0 6 * * * · pull → upsert → publish if changed</text>
<text class="s" fill="#534AB7" x="696" y="488">SA: a-game-worker-sa</text>
<text class="s" fill="#534AB7" x="696" y="506">cfg: inline env (no ConfigMap)</text>
<text class="s" fill="#534AB7" x="696" y="524">secrets: db · rabbitmq · sports-api</text>
<text class="t" fill="#8A83C8" x="696" y="541">no Service — outbound only</text>

<!-- ============ HEADLESS SERVICES ROW ============ -->
<rect x="64" y="596" width="236" height="56" rx="8" fill="#F1EFE8" stroke="#7C7A72" stroke-width="0.6"/>
<text class="h" fill="#2C2C2A" x="182" y="617" text-anchor="middle">postgres Service — headless</text>
<text class="s" fill="#5F5E5A" x="182" y="635" text-anchor="middle">:5432 · stable per-pod DNS</text>

<rect x="374" y="596" width="236" height="56" rx="8" fill="#F1EFE8" stroke="#7C7A72" stroke-width="0.6"/>
