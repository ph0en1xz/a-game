[project]
name = "a-game-api"
version = "0.1.0"
description = "A-Game API Service"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["app/__version__.py"]

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:',
    'raise AssertionError\("unreachable"\)',
]

[tool.mypy]
plugins = ["pydantic.mypy"]

# asyncpg ships no py.typed marker, so mypy can't see its types.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
