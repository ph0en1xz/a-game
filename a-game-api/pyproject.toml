[project]
name = "a-game-api"
version = "0.1.0"
description = "A-Game API Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

# asyncpg ships no py.typed marker, so mypy can't see its types.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
